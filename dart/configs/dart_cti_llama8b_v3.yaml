experiment_name: dart_cti_llama8b_v3
output_root: dart-artifacts/dart_cti_llama8b

teacher:
  model_path: meta-llama/Llama-3.1-8B-Instruct
  backend: vllm
  batch_size: 4096
  max_new_tokens: 1024
  temperature: 0.7
  top_p: 0.95
  max_prompt_length: 0
  trust_remote_code: false
  gpu_memory_utilization: 0.95
  vllm_kwargs: {}

dataset:
  train_paths:
    - rlvr/mydata/minerva_base/minerva_base_train.parquet
  target_accepted: 2
  max_attempts: 32
  response_max_tokens: 2048

guided_fill:
  enabled: true
  label_details_dir: dataset/label_details
  max_details_chars: 8096
  max_prompt_length: 4096
  enforce_no_id: false
  max_attempts_per_question: 0
  acr_filters:
    enabled: false

validation:
  every_n_steps: 10
  sources:
    minerva_dev:
      paths:
        - rlvr/mydata/minerva_base/minerva_base_dev.parquet
    athena_bench:
      paths:
        - rlvr/mydata/athena/athena_cti_ate.parquet
        - rlvr/mydata/athena/athena_cti_ckt.parquet
        - rlvr/mydata/athena/athena_cti_rcm.parquet
        - rlvr/mydata/athena/athena_cti_rms.parquet
        - rlvr/mydata/athena/athena_cti_taa.parquet
        - rlvr/mydata/athena/athena_cti_vsp.parquet

final_eval_paths:
  - rlvr/mydata/minerva_base/minerva_base_dev.parquet
  - rlvr/mydata/athena/athena_cti_ate.parquet
  - rlvr/mydata/athena/athena_cti_ckt.parquet
  - rlvr/mydata/athena/athena_cti_rcm.parquet
  - rlvr/mydata/athena/athena_cti_rms.parquet
  - rlvr/mydata/athena/athena_cti_taa.parquet
  - rlvr/mydata/athena/athena_cti_vsp.parquet

students:
  - meta-llama/Llama-3.2-3B-Instruct
  - meta-llama/Llama-3.1-8B-Instruct
  - Qwen/Qwen3-4B-Base
  - Qwen/Qwen3-8B-Base
