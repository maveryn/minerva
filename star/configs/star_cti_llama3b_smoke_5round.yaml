experiment_name: star_cti_llama32_3b_smoke_5round
model_path: meta-llama/Llama-3.2-3B-Instruct
train_path: rlvr/mydata/minerva_base/minerva_base_train.parquet
val_paths:
  - rlvr/mydata/minerva_base/minerva_base_dev.parquet
  - rlvr/mydata/athena/athena_cti_ate.parquet
  - rlvr/mydata/athena/athena_cti_ckt.parquet
  - rlvr/mydata/athena/athena_cti_rcm.parquet
  - rlvr/mydata/athena/athena_cti_rms.parquet
  - rlvr/mydata/athena/athena_cti_taa.parquet
  - rlvr/mydata/athena/athena_cti_vsp.parquet
output_root: star-artifacts/star_cti_llama32_3b_smoke_5round
num_rounds: 5
limit_train_rows: 8
success_threshold: 1.0
wandb:
  enabled: false
  project: minerva
  name: star_cti_llama32_3b_smoke_5round
  job_type: star-smoke
generation:
  backend: vllm
  batch_size: 8
  max_new_tokens: 256
  max_prompt_length: 0
  temperature: 0.7
  top_p: 0.95
  gpu_memory_utilization: 0.92
  trust_remote_code: false
evaluation:
  backend: vllm
  batch_size: 8
  max_new_tokens: 256
  max_prompt_length: 0
  limit_per_val_path: 8
  gpu_memory_utilization: 0.92
training:
  backend: verl
  total_epochs: 1
  total_steps: 1
  train_batch_size: 8
  micro_batch_size_per_gpu: 1
  max_length: 2048
  response_max_tokens: 256
  model_dtype: bfloat16
  model_strategy: fsdp
  enable_gradient_checkpointing: true
  reward_eval_batch_size: 8
  reward_eval_max_prompt_length: 2048
  reward_eval_max_response_length: 256
  n_gpus: 1
  save_freq: 1
  test_freq: 1
  save_best_only: true
