experiment_name: star_cti_smoke
model_path: Qwen/Qwen2.5-0.5B-Instruct
train_path: rlvr/mydata/minerva_base/minerva_base_train.parquet
val_paths:
  - rlvr/mydata/minerva_base/minerva_base_dev.parquet
output_root: star-artifacts/star_cti_smoke
num_rounds: 1
success_threshold: 1.0
limit_train_rows: 4
generation:
  backend: vllm
  batch_size: 2
  max_new_tokens: 128
  max_prompt_length: 1536
  temperature: 0.7
  top_p: 0.95
  gpu_memory_utilization: 0.9
  trust_remote_code: false
evaluation:
  batch_size: 2
  max_new_tokens: 128
  max_prompt_length: 1536
training:
  backend: verl
  total_epochs: 1
  total_steps: 1
  train_batch_size: 8
  micro_batch_size_per_gpu: 2
  max_length: 2048
  reward_eval_batch_size: 4
  reward_eval_max_prompt_length: 1536
  reward_eval_max_response_length: 256
  n_gpus: 1
  save_freq: 10
  test_freq: 10
